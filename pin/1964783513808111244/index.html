<article><div><span><span>短期最优解 | 前段时间我就发现了一个短期最优解。<br>因为东大通缩，西大通涨，西大通过国债源源不断的印钞。钞票疯狂涌入各种资产，持续把美股推高。东大通缩。人民币的购买力保持坚挺。但这背后最奇妙的在于汇率，人民币兑美元的汇率就是个 bug， 长期保持在 7 以上，这就形成了一个暂时性的短期最优解，那就是用美元理财，用人民币消费。</span></span></div></article>
