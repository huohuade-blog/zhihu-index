<article><div><span><span>昨天，英特尔官方媒体正式宣布，将加入特斯拉（Tesla）主导的“TeraFab”宏大计划。双方目标明确，要在美国本土打造规模远超现有水平的芯片生产线，实现每年 1 TW（太瓦）的惊人算力交付。<br>这个消息发布后，英特尔暴涨11个点，创了新高；而特斯拉跌了1个点。</span></span></div><p>引用：<a href="https://zhuanlan.zhihu.com/p/1992322374725571725" rel="noopener noreferrer">查看被引用的知乎内容</a></p></article>
