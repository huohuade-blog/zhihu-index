<article><div><span><span>复利体系 | 公司应该就是最可见的复利体系。<br>大公司因为有这个体系在，所以营造能不断增长翻倍。<br>所以我们才想持有这样公司的股票。实际上是买入获得复利的机会。<br>个人也需要打造复利体系，思考方向就是，我做什么事情，在未来能持续滚雪球。更细分，可以拆解成每半年的任务目标，上个半年的结果可以带入下个半年的任务中。</span></span></div></article>
