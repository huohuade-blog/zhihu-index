<header><h1>有人问，为啥职场人都控制不了体重？</h1><p class="muted">momo · 发布：<time>2026-04-30T12:01:00+08:00</time></p>
<p><a href="https://www.zhihu.com/pin/2033153177130944315" rel="noopener noreferrer">查看知乎原文</a></p></header>
<article><div><span><span>有人问，为啥职场人都控制不了体重？ | 答：要避免过劳肥需要极为强大的主体性。因为现在卷王太多了，如果主体性不够，很容易盲从，被迫卷入无效内卷；丧失锻炼和休息时间，从而造成过劳肥。<br>活在失业的恐惧里，被迫加班，被迫过劳肥，被迫失去健康的身体和颜值。<br>没有主体性就会被层层下压，最终被迫失去一切。<br>回归本源，人最重要的就是自尊自爱和主体性。</span></span></div></article>
