<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; base-uri 'none'; object-src 'none'; form-action 'self'">
  <title>全文搜索 · 霍华德的知乎归档</title>
  <meta name="description" content="霍华德的知乎正文归档，支持标题和全文搜索。">
  <link rel="canonical" href="https://huohuade-blog.github.io/zhihu-index/">
  <link rel="stylesheet" href="archive-search/search.css">
  <script defer src="archive-search/engine.js"></script>
  <script defer src="archive-search/app.js"></script>
</head>
<body>
  <header><a class="brand" href="catalog.html"><b class="logo">知</b><strong>霍华德的知乎归档</strong></a><a href="catalog.html">返回完整索引 ↗</a></header>
  <main>
    <div class="eyebrow">SEARCH THE ARCHIVE</div>
    <h1>从一句话，找回一篇文章。</h1>
    <p class="intro">搜索那些读过的观点、问题与答案。</p>
    <div class="grid">
      <section aria-label="全文搜索">
        <form class="search" action="index.html" method="get" role="search">
          <span aria-hidden="true">⌕</span>
          <input id="query" name="q" type="search" maxlength="300" aria-label="搜索标题或正文" placeholder="搜索标题或正文，多个关键词用空格分隔" aria-describedby="search-help">
          <button type="submit">搜索</button>
        </form>
        <div class="filters"><div class="types" role="group" aria-label="内容类型"><button type="button" data-type="all" aria-pressed="true">全部</button><button type="button" data-type="answer" aria-pressed="false">回答</button><button type="button" data-type="article" aria-pressed="false">文章</button></div><label>排序 <select id="sort"><option value="relevance">相关度优先</option><option value="date">最新发布</option></select></label></div>
        <p id="status" role="status" aria-live="polite">正在加载全文索引…</p>
        <button id="retry" type="button" hidden>重新加载</button>
        <noscript><p>全文搜索需要启用 JavaScript。你仍可通过<a href="catalog.html">完整索引</a>浏览所有归档。</p></noscript>
        <div id="results" aria-busy="true"></div>
        <nav id="pagination" aria-label="搜索结果分页"></nav>
      </section>
      <aside><h2>在归档中探索</h2><p id="archive-stats">1,108 个回答 · 70 篇文章<br>使用真实归档正文搜索</p><hr><h2>试试这些关键词</h2><div class="suggestions"><button data-query="芯片">芯片 ↗</button><button data-query="机器学习">机器学习 ↗</button><button data-query="大学">大学 ↗</button><button data-query="新加坡">新加坡 ↗</button></div><p id="search-help">多个关键词用空格分隔，所有词均需命中标题或正文。结果优先展示标题匹配的内容。</p><p>另有 8 条源页面不存在的记录，仍保留在完整索引中，不计入全文搜索。</p></aside>
    </div>
  </main>
  <footer>纯静态全文搜索 · 搜索在你的浏览器中完成</footer>
</body>
</html>
