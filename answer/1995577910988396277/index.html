<article><p>这个事情我还真的深入想过，因为老钟的主流是做题家文化，大家都是分配上面给的资源，实际上就是一种<span>零和博弈</span>。大家都是竞争关系，同学拿到资源我就拿不到。</p><p><span>昂撒</span>的文化是我和同学一起抢别人，所以我们需要合作，而非竞争。今天抢委内瑞拉，明天抢伊朗。</p><p>这造就了两种完全不同的心态。</p></article>
