<article><p data-pid="DT_qXm29">生化环材的优点有一个：专业带来的苦难及其反思，催促人在思想上成熟，提高思辨能力。正所谓“国家不幸诗家幸，赋到沧桑句便工”。</p><p data-pid="CmIvOaPm">反之计算机专业的学生，虽然已经年薪百万了，但思想还很naive。甚至还有精资社达等臭毛病。</p></article>
