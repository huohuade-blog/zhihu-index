<article><p>未来想进入的领域看中标签的话，例如考公务员、当医生等等</p><p>那么你唯一的选择就是转专业或者退学重新高考</p><p>如果未来想进入的领域，不限于标签的话</p><p>那么高强度自学+辅修，也可以自救</p><p>当然不看标签的领域并不多</p><p>主要集中在新兴领域，如<span>大语言模型</span>、人形机器人等</p><p></p></article>
