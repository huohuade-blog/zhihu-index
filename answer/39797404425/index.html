<article><p>终身教职根本不是啥神奇的东西。一种是有编制的，和公务员一样，公务员是可以随便裁撤的吗？</p><p>另外一种是没编制的，按照西方的玩法，实际上就是一个长期劳动合同，直接签约到60岁。</p><p>按照中国劳动法，对于劳动者连续工作满十年应当订立无固定期限劳动合同。</p><p>所以你要取消终身教职，你是打算如何违法呢？</p></article>
