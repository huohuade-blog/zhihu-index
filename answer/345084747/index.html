<header><h1>为什么富人越来越富，穷人越来越穷？</h1><p class="muted">霍华德 · 发布：<time>2018-03-19T01:35:35+00:00</time> · 更新：2018-03-19T01:35:35+00:00</p>

<article><p data-pid="G7YknkXD">我就谈一点我的观察。</p><p data-pid="jpIrpklp">因为钱越多投资回报率越高。不谈复杂的投资策略，单就简单的存款，穷人几万块钱就只能拿大众的利率，富人上亿的资金可以和银行谈协定利率，远高于穷人。</p><p data-pid="n3Vz_3o8">富人的投资回报率高于穷人，所以富人越富，穷人越穷</p></article>
