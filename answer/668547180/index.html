<article><p data-pid="hrvLKGGB">你的这个问题跟fasttext、word2vec没有关系。你的这个做法是上古的手工特征流。手动抽取一个词的一些特征来做情感分类。</p><p data-pid="-2Vz9RFJ">按理来说很简单的，分词和词性用jieba一步到位，然后统计一下词频率和对应的位置就完事了。</p></article>
