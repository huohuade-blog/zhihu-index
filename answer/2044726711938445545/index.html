<article><p>这就是耿同学被封杀的根本原因，跟大政方针向左。</p><p>但哪些学阀真没那个能力，除了造假啥也不会。</p><p>以<span>有组织科研</span>强化基础研究，听起来很好。</p><p>但只会让学阀掌握更多的资源，从而造成更大的浪费。</p><p>同时，更加挤压不愿意和学阀同流合污的普通科研工作者的生存空间。</p></article>
