<article><p>已经拿到PR不如直接<span>入籍</span>，然后用新加坡专门的<span>H1B quota</span>去美国工作。</p><p>据我所知，新加坡没多少人愿意去美国打工的，所以那个quota根本用不完。</p><p>等去美国工作一段时间后，可以再选择，要不要走美国的移民流程。</p><p>就算不再移民美国，拿着新加坡国籍，在全世界走动，也非常方便了。</p></article>
