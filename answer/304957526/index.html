<article><p data-pid="uM8fuEMa">看到伪材料的考试题就生气。名词解释什么鬼？论述题什么鬼？写出表达式说明意义什么鬼？不用推导，背个公式就开始扯淡。所以伪材料搞科研是不如物理的，因为基础太弱，往往就知道个名词，深层次的推导理解数学结构完全不懂。</p><figure><noscript><img class="origin_image zh-lightbox-thumb" data-original="https://pic1.zhimg.com/v2-d4434c73e1e279aeb50a21470511eb8f_r.jpg?source=2c26e567" data-original-token="v2-d4434c73e1e279aeb50a21470511eb8f" data-rawheight="2048" data-rawwidth="1152" decoding="async" loading="lazy" referrerpolicy="no-referrer" src="https://pic1.zhimg.com/v2-d4434c73e1e279aeb50a21470511eb8f_r.jpg?source=2c26e567" width="1152"/></noscript><img class="origin_image zh-lightbox-thumb lazy" data-actualsrc="https://picx.zhimg.com/50/v2-d4434c73e1e279aeb50a21470511eb8f_720w.jpg?source=2c26e567" data-original="https://pic1.zhimg.com/v2-d4434c73e1e279aeb50a21470511eb8f_r.jpg?source=2c26e567" data-original-token="v2-d4434c73e1e279aeb50a21470511eb8f" data-rawheight="2048" data-rawwidth="1152" decoding="async" loading="lazy" referrerpolicy="no-referrer" src="https://pic1.zhimg.com/v2-d4434c73e1e279aeb50a21470511eb8f_r.jpg?source=2c26e567" width="1152"/></figure></article>
