<article><p>我有一个观点，技术只是杠杆，文明自身方向才是真正的发展动力。</p><p>如果人性向上，那么这个国家会越来越好。</p><p>如果人性向下，那么这个国家会走向毁灭。</p><p>技术不过是一种放大器，</p><p>正义获得先进技术，会增进全民福祉</p><p>邪恶获得先进技术，会带来一场灾难</p></article>
