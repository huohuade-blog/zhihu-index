<article><p>和我在腾讯期间遇到的困境一样</p><p>我在公司的时候并没有找到解法</p><p>去健身房绝对是错误解法</p><p>高强度工作下去健身房只会更累</p><p>996后需要养而非练</p><p>要吸收天地灵气而非燃烧卡路里</p><p>你真正需要的是躺下来做拉伸</p><p>锻炼深层肌肉这样不会感觉很累</p><p>练完好好躺一下工作效率回复不少</p><p></p></article>
