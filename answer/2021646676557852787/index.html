<article><p>实际上，我觉得很强的记忆力也没有太大的用，记忆力的目的就是让你在<span>工作记忆</span>里不断<span>反刍</span>，最后提炼出一点可以持久化、永久化的东西存到大脑的另外一个地方。</p><p>然后你每次下次遇到类似的问题，你就会马上调出那个持久性的经验，快速的解决当前的问题</p></article>
