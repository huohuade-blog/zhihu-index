<header><h1>记者的社会地位越来越低，是什么导致了这种现象？</h1><p class="muted">momo · 发布：<time>2026-08-02T03:04:24+00:00</time> · 更新：2026-08-02T03:04:24+00:00</p>

<article><p>记者实际上是非常重要的<span>社会监督力量</span>的一环。</p><p>这个监督力量既可以来自于官方，例如官媒官报。</p><p>也可以来自于民间，例如各种<span>民营媒体</span>和报纸。</p><p>记者社会地位越来越低，实际上就是监督力量越来越弱。</p><p>监督越少，监督力量越弱，社会就会越来越好吗？</p><p>对此，我持怀疑态度。</p></article>
