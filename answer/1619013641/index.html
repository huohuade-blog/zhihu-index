<article><p data-pid="QgFnaDFj">这问题当年是不成立的。那时候生化环材的分数比现在很多热门专业要高。所以那时候很多人为了学生化环材，相反还去了更差的学校。</p><p data-pid="FIxrOO-m">所以问题应该是“你后悔为了更差的学校而去学生化环材吗？”</p></article>
