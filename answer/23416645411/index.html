<article><p>没有不行，除了阿里这种明显被拼多多冲击的公司，其他公司营收基本都在稳步前进。例如腾讯，营业收入已经从19年的3700亿，爬升至6000亿。</p><figure><div><img loading="lazy" src="https://picx.zhimg.com/v2-1c10df4c229feb6f20aea741de21a9af_r.jpg?source=2c26e567" width="1206"></div></figure><p>相反，材料小将喜欢吹的宁德时代，营业收入下滑，同比增长率下滑，连员工数量都在减少。</p><figure><div><img loading="lazy" src="https://picx.zhimg.com/v2-a45616fbbebdadc1735da265c4e9a610_r.jpg?source=2c26e567" width="1206"></div></figure><p></p></article>
