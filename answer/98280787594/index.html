<header><h1>为什么很多公司因为「降本增效」而倒闭了？</h1><p class="muted">momo · 发布：<time>2025-02-11T08:03:11+00:00</time> · 更新：2025-02-11T08:03:11+00:00</p>

<article><p>我突然才意识到降本增效可能是个<span>NP-Hard问题</span>。</p><p>单纯的降本是<span>P问题</span>，排个序，然后从花销大的开始砍。</p><p>单纯的增效也是P问题，提高薪资待遇，招牛人进来肯定能增效。</p><p>但既要又要，历来都是老大难问题，最聪明的计算机科学家们都往往无法解决。</p><p></p></article>
