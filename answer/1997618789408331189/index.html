<article><p>大家扪心自问，在工作中哪里有那么多事情需要做？</p><p>我的观察是，工作里充斥着90%鸡毛蒜皮的破事。</p><p>多想少做，有的放矢，你可以节省90%的时间，</p><p>然后用这节省下来的时间去运动，</p><p>你会收获一个幸福健康的人生。</p><p></p></article>
