<article><p>个人观点</p><p>大规模深度学习系统是未来芯片设计需求的前沿</p><p>了解大模型系统当前的痛点</p><p>有利于做出前沿的科研工作</p><p>例如deepseek V3中吐槽的FP8累加问题</p><p>这显然是集成电路工作者应该解决的问题</p><p>而不是算法工程师要解决的问题</p></article>
