<article><p>Fab本来就是苦役。越能吃苦，成本越低。</p><p>台积电在美国建厂的成本是在台湾的四五倍。</p><p>之前的趋势是，北美的fab衰落，东亚的fab崛起。</p><p>唯一能扭转这一趋势的就是长期关税。</p><p>美国如果能坚持 10 年以上的长期关税。</p><p>那么有些事情确实就会开始发生变化。</p></article>
