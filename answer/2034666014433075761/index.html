<article><p>这个回答说的很好。我也有相似的经历。这么多年，最后感悟下来，总结成下面一句</p><p>没有什么制度、观念、理想是非黑即白的，都是灰色的。但灰色的深浅显然有差别。</p><p>就像专业讨论来讨论去，发现所有专业都劝退。但对我而言，不想吸毒气一条就够，生化环材是必须被排除的选项。</p><div><a href="https://www.zhihu.com/question/2015093388966373049/answer/2032463543136692096?share_code=d2odgwZohJZd&amp;utm_psn=2034664584703951086" rel="noopener noreferrer"><span class="LinkCard-image LinkCard-image--default"></span><span class="LinkCard-contents"><span class="LinkCard-title loading"></span><span class="LinkCard-desc loading"></span></span></a></div><p></p></article>
