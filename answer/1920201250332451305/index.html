<article><p>21年的时候跑了深圳很多楼盘</p><p>当时我就发现<span>香蜜湖</span>是水分最少的，环境最好的</p><p>一直作为深圳楼市的坐标系用</p><p>23年香蜜湖均价13.6万（峰值）</p><p>25年均价12.7万</p><p>真心深圳第一抗跌</p><p>当时去看<span>宝安</span>一个楼盘</p><p>城中村环境也敢要均价10万+</p><p>我当时就笑了，根本不值10万</p><p>果然现在已经跌成狗了</p></article>
