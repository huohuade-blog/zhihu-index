<article><p>我以前认为，化债=提升财政收入，那么通过让物价上涨，从而带动消费税上涨，提升财政收入，这是化债路径之一，这一路径确实会带来大通胀。</p><p>但现在明显出现了另外一个化债路径，让债主打折，七折五折就把债还了，这一路径不一定会通胀，甚至可能造成<span>通缩</span>。</p></article>
