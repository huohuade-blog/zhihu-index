<article><p>说一个当年不屑一顾，回国后发现完全找不到平替的<span>astons牛排</span>。</p><p>这牛排<span>NUS</span>学生基本都很熟悉，在utown二楼食阁很容易就能找到。</p><p>astons牛排性价比很高，NUS学生有折扣，而且是“真牛排”。</p><p>回国后，便宜的牛排基本就不是“真牛排”；而“真牛排”又太贵，几百甚至上千。</p><figure><div><img loading="lazy" src="https://picx.zhimg.com/v2-fbcdb292b4b06319e2ba2fd4cfc35ec2_r.jpg?source=2c26e567" width="3861"></div></figure><p></p></article>
