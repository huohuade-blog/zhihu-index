<article><p>我觉得最好的解释还是<span>资产负债表衰退</span>。</p><p>即无论是个人、企业，甚至政府，</p><p>拿到钱后的第一件事都是拿去还债。</p><p>这是第一大因素，比其他因素影响都要大。</p></article>
