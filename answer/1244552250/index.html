<article><p data-pid="mkI9zU9k">这图能用到知乎破产。60末到80初这批人就是中国的baby boomer，赶上房价低的时候买房，享受房价与工资起飞的黄金时代，是中国拥有财富最多的一批人。而现在年轻人对应美国千禧一代，长期受高房价压迫，陷入贫穷，拥有的社会财富极少。</p><figure data-size="normal"><noscript><img class="origin_image zh-lightbox-thumb" data-default-watermark-src="https://picx.zhimg.com/50/v2-d4dc8ca3b7daadeeafc83140d82e4047_720w.jpg?source=2c26e567" data-original="https://pic1.zhimg.com/v2-8a99a58f0e94cd31a3e1e3807b0f48eb_r.jpg?source=2c26e567" data-original-token="v2-2371e8c3701ee5fcc4f05111256f4979" data-rawheight="553" data-rawwidth="756" data-size="normal" decoding="async" loading="lazy" referrerpolicy="no-referrer" src="https://pic1.zhimg.com/v2-8a99a58f0e94cd31a3e1e3807b0f48eb_r.jpg?source=2c26e567" width="756"/></noscript><img class="origin_image zh-lightbox-thumb lazy" data-actualsrc="https://picx.zhimg.com/50/v2-8a99a58f0e94cd31a3e1e3807b0f48eb_720w.jpg?source=2c26e567" data-default-watermark-src="https://picx.zhimg.com/50/v2-d4dc8ca3b7daadeeafc83140d82e4047_720w.jpg?source=2c26e567" data-original="https://pic1.zhimg.com/v2-8a99a58f0e94cd31a3e1e3807b0f48eb_r.jpg?source=2c26e567" data-original-token="v2-2371e8c3701ee5fcc4f05111256f4979" data-rawheight="553" data-rawwidth="756" data-size="normal" decoding="async" loading="lazy" referrerpolicy="no-referrer" src="https://pic1.zhimg.com/v2-8a99a58f0e94cd31a3e1e3807b0f48eb_r.jpg?source=2c26e567" width="756"/></figure><p></p></article>
