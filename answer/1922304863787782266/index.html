<article><p>化工的原本定位就是化学这个基础学科的工程化专业。</p><p>“<span>三传一反</span>”是化工核心理论：</p><p>• 三传：<span>动量</span>传递（流体流动）、热量传递（传热）、质量传递（<span>传质</span>）</p><p>• 一反：<span>化学反应工程</span>（化学反应）</p><p>现在嘛，化工已经材料化，一堆搞材料的老师，正儿八经搞三传一反的相反没几个人了。</p><figure><div><img loading="lazy" src="https://pic1.zhimg.com/v2-a6c0546ab7254b513a9532ac5fdd9f65_r.jpg?source=2c26e567" width="1206"></div></figure><p></p></article>
