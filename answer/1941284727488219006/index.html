<article><p>如果用<span>资不抵债</span>来定义返贫的话</p><p>那么只要房价跌破当年买房的价格</p><p>基本就可以算资不抵债</p><p>据说现在房价已经回到2017年了</p><p>那么你可以算算这中间买房的中产有多少</p><p>那么就可以估计有多少中产返贫了</p></article>
