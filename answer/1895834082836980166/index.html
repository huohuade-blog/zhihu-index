<header><h1>医生为什么要搞科研，如果医生科研都搞得很牛逼，还要科学家干嘛？</h1><p class="muted">momo · 发布：<time>2025-04-16T05:41:08+00:00</time> · 更新：2025-04-16T05:41:08+00:00</p>

<article><p>我也觉得医生搞科研是大量浪费科研资源</p><p>且不说很多医生的科研水平真的很低</p><p>任何一个国家的科研资源都是很有限的</p><p>拿去给医生做评职称的指标真是浪费</p><p>医生拿不到基金也不会失业</p><p>“科学家”拿不到经费，实验室真的会关门</p></article>
